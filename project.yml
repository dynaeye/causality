name: Causality
options:
  bundleIdPrefix: tv.lzzy
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    # 默认 ad-hoc：没有证书的人 clone 下来也能直接 build。
    # 本机发布凭据从 Config/Local.xcconfig 读（已被 .gitignore 忽略）。
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
  configFiles:
    Debug: Config/Shared.xcconfig
    Release: Config/Shared.xcconfig

packages:
  CausalityCore:
    path: Packages/CausalityCore

targets:
  Causality:
    type: application
    platform: macOS
    sources:
      - path: Sources/Causality
    dependencies:
      - package: CausalityCore
        product: CausalityCore
    info:
      path: Sources/Causality/Info.plist
      properties:
        CFBundleName: Causality
        CFBundleDisplayName: Causality
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: 因果项目
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - tv.lzzy.causality.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: tv.lzzy.causality.project
            UTTypeDescription: 因果项目
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - causal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.lzzy.causality
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CausalityTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CausalityAppTests
    dependencies:
      - target: Causality
      - package: CausalityCore
        product: CausalityCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.lzzy.causality.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Causality:
    build:
      targets:
        Causality: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CausalityTests
    archive:
      config: Release
