name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # 与本机对齐：Xcode 27 镜像 + 钉住具体版本，避免默认值漂移。
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app
    steps:
      - uses: actions/checkout@v4
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Check
        run: ./scripts/check.sh
